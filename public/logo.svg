<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- 跑步人物图标 -->
  <g transform="translate(100, 80)">
    <!-- 头部 -->
    <circle cx="156" cy="60" r="30" fill="white" opacity="0.95"/>
    
    <!-- 身体 -->
    <path d="M156 95 L156 200" stroke="white" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <!-- 左臂 -->
    <path d="M156 120 L100 160" stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <!-- 右臂 -->
    <path d="M156 120 L200 90" stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <!-- 左腿 -->
    <path d="M156 200 L110 280" stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <!-- 右腿 -->
    <path d="M156 200 L200 290" stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <!-- 速度线 -->
    <path d="M230 140 L270 140" stroke="url(#iconGradient)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M220 165 L250 165" stroke="url(#iconGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M225 190 L260 190" stroke="url(#iconGradient)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- 闪电图标 -->
  <path d="M400 380 L360 420 L385 420 L360 460 L420 400 L395 400 Z" fill="url(#iconGradient)" opacity="0.9"/>
  
  <!-- 圆环 -->
  <circle cx="256" cy="430" r="35" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>
</svg>